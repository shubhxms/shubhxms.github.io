baseURL = 'https://shubhamshah.net/'
locale = 'en-us'
title = '✪ Shubham Shah'
theme = "folio"
enableGitInfo = true
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true
paginate = 4

[params]
description = "personal website of shubham shah"
repo = "https://github.com/shubhxms/shubhxms.github.io"
born = 2003
feedApi = "https://feed.shubhxms.workers.dev"
# "paper": pages are a sheet on a desk, with floating reader controls.
# "plain": pages sit on the site itself, without desk or sheet edge.
# Readers can switch from the palette; this is the default.
layout = "plain"
# Section heads: "side" (names in a side column, beyond a dotted rule) or
# "inline" (underlined, in the text).
# Readers can switch from the palette; this is the default.
heads = "side"

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/shubhxms/"

[[params.social]]
name = "Twitter"
icon = "twitter"
url = "https://twitter.com/shubhxms/"

[[params.social]]
name = "Telegram"
icon = "telegram"
url = "https://telegram.me/shubhxms"

[[params.social]]
name = "Bluesky"
icon = "bluesky"
url = "https://bsky.app/profile/shubhamshah.net"

[[menu.main]]
name = "Now"
url = "/now"
weight = 1

[[menu.main]]
name = "Projects"
url = "/projects"
weight = 3

[[menu.main]]
name = "Contact"
url = "/contact"
weight = 2

# [[menu.main]]
# name = "Timeline"
# url = "/timeline"
# weight = 2

[[menu.main]]
name = "Notes"
url = "/notes"
weight = 5

[[menu.main]]
name = "Shelf"
url = "/shelf"
weight = 6

[[menu.main]]
name = "Core"
url = "/core"
weight = 7

[[menu.main]]
name = "Feed"
url = "/feed"
weight = 4

[[menu.main]]
name = "Uses"
url = "/uses"
weight = 8

[[menu.main]]
name = "Colophon"
url = "/colophon"
weight = 9
[permalinks]
pages = '/:title'

[markup.goldmark.renderer]
unsafe = true
# A line break in the source is a line break on the page.
hardWraps = true

# Maths is handed to KaTeX at build time (layouts/_default/_markup/render-passthrough.html).
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[outputFormats]
[outputFormats.data]
mediaType = "text/html"
isHTML = true

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"

[outputFormats.searchindex]
mediaType = "application/json"
baseName = "search"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "data", "searchindex"]
page = ["HTML", "markdown"]

# The project's own folders, as Hugo mounts them by default, plus the
# images as assets too, so pages can resize them (covers, photos).
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "static/images"
target = "assets/images"
