# The shelf: books and films, by their covers. Rendered by the Shelf page
# (layouts/_default/shelf.html): each section a grid of covers. An entry
# without a cover is left off. Core (content/pages/core.md) is the written
# list, and overlaps.
#
# A section has items, or lists of items (Books, by category). An entry
# takes: title; by (author or maker); year; cover (an image under
# /images/shelf/); note (a path on this site, linked); pick: true to show
# it in the home page's Lately.

sections:
