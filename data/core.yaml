# Core: things that matter to me, in lists. Rendered by the Core page
# (layouts/_default/core.html) as one catalogue per list: entries with a
# cover show it, the rest are set in type, interleaved in list order.
#
# An entry takes: title; by (author or maker) or year and by; cover
# (an image under /images/shelf/); note (a path on this site, linked); url
# (elsewhere, linked); what (for the Internet list); pick: true to show
# it in the home page's Lately.

