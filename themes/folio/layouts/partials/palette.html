{{- with site.Home.OutputFormats.Get "searchindex" }}
<dialog class="palette" aria-label="Commands and search" data-index="{{ .RelPermalink }}">
  <input type="text" placeholder="Jump to a page, section or command…" aria-label="Search" role="combobox" aria-controls="palette-options" aria-expanded="true" autocomplete="off" spellcheck="false" />
  <ul id="palette-options" role="listbox"></ul>
  <p class="palette-status" aria-live="polite"></p>
  <p class="palette-keys"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> open · <kbd>esc</kbd> close</p>
</dialog>
{{- end }}
