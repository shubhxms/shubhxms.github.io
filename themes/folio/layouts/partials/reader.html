{{- /* Shown by the script once there are sheets to page through. */}}
<nav class="reader" aria-label="Reader" hidden>
  <button type="button" data-action="prev" title="Previous page (k)" aria-label="Previous page">↑</button>
  <span class="reader-pos" aria-live="polite"><span data-reader="page">1</span> / <span data-reader="pages">1</span></span>
  <button type="button" data-action="next" title="Next page (j)" aria-label="Next page">↓</button>
  <span class="reader-section" data-reader="section"></span>
  <span class="reader-rule" aria-hidden="true"></span>
  <button type="button" data-action="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
  <button type="button" data-action="zoom-fit" class="reader-zoom" title="Fit width (0)" aria-label="Fit width"><span data-reader="zoom">fit</span></button>
  <button type="button" data-action="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <span class="reader-rule" aria-hidden="true"></span>
  <button type="button" data-action="palette" title="Commands and search (⌘K)" aria-label="Commands and search">⌘K</button>
</nav>
