{{- /* Shown by the script on pages set as paper. A fixed-size box: the
       controls on one line, the current section's title on the next. */}}
<nav class="reader" aria-label="Reader" hidden>
  <div class="reader-controls">
    <button type="button" data-action="prev" title="Previous section (k)" aria-label="Previous section">↑</button>
    <span class="reader-pos" aria-live="polite"><span class="reader-mark">§</span> <span data-reader="position">—</span></span>
    <button type="button" data-action="next" title="Next section (j)" aria-label="Next section">↓</button>
    <span class="reader-rule" aria-hidden="true"></span>
    <button type="button" data-action="text-smaller" title="Smaller text (−)" aria-label="Smaller text">A−</button>
    <button type="button" data-action="text-reset" class="reader-size" title="Default text size (0)" aria-label="Default text size"><span data-reader="text">100%</span></button>
    <button type="button" data-action="text-larger" title="Larger text (+)" aria-label="Larger text">A+</button>
    <span class="reader-rule" aria-hidden="true"></span>
    <button type="button" data-action="palette" title="Commands and search (⌘K)" aria-label="Commands and search">⌘K</button>
  </div>
  <p class="reader-section" data-reader="section"></p>
</nav>
