{{- /* A Markdown image, resized to the text's width (twice over, for sharp
       screens) as WebP when it is one of the site's own. */ -}}
<img src="{{ partial "fit-image.html" (dict "src" .Destination "width" 1200) }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async" />
