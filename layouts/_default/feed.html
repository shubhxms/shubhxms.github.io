{{ define "main" }}
<main>
	<article>
		<div class="title">
			<h1 class="title">{{ .Title }}</h1>
		</div>
		{{ if isset .Params "tldr" }}
		<div class="tldr">
			{{ .Params.tldr | markdownify }}
		</div>{{ end }}
		<hr class="divider-main">
		<section class="body feed-body">
			<div id="feed-root"></div>
		</section>
	</article>
	<link rel="stylesheet" href="{{ "css/feed.css" | relURL }}?v=18">
	<script>window.FEED_API = {{ .Site.Params.feedApi | jsonify | safeJS }};</script>
	<script src="{{ "js/feed.js" | relURL }}?v=13" defer></script>
</main>
{{ end }}

{{ define "rail" }}
<aside id="fd-panel" aria-hidden="true">
	<button class="fd-x" type="button" aria-label="close detail">×</button>
	<div class="fd-pin"></div>
</aside>
{{ end }}
